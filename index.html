<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence Book - Smart Learning</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Noto Sans Bengali", Arial, sans-serif;
}

body {
  background: linear-gradient(180deg, #eef6ff 0%, #f8fafc 100%);
  color: #172554;
  padding: 15px;
}

header {
  text-align: center;
  padding: 20px 12px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  border-radius: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
}

header h1 { font-size: 26px; }
header p { margin-top: 8px; font-size: 15px; opacity: 0.95; }

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.tabs button, .action-btn {
  border: none;
  padding: 12px;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease;
}

.tabs button {
  flex: 1;
  font-size: 14px;
}

.tabs button.active {
  background: #7c3aed;
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
}

.display-box {
  background: white;
  border: 2px solid #93c5fd;
  border-radius: 22px;
  text-align: center;
  padding: 22px 16px;
  margin-bottom: 18px;
  box-shadow: 0 8px 20px rgba(219, 234, 254, 0.9);
  overflow: hidden;
}

@keyframes floatSlow {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}

@keyframes animalMove {
  0% { transform: translateY(0) scale(1) rotate(0deg); }
  25% { transform: translateY(-14px) scale(1.12) rotate(-8deg); }
  50% { transform: translateY(-4px) scale(1.16) rotate(8deg); }
  75% { transform: translateY(-12px) scale(1.08) rotate(-5deg); }
  100% { transform: translateY(0) scale(1) rotate(0deg); }
}

.picture {
  font-size: 80px;
  margin: 8px auto 12px;
  display: inline-block;
  animation: floatSlow 3s ease-in-out infinite;
  cursor: pointer;
  user-select: none;
}

.picture.moving {
  animation: animalMove 0.9s ease-in-out;
}

.big-char {
  font-size: 74px;
  font-weight: bold;
  color: #2563eb;
  line-height: 1.25;
}

.word {
  font-size: 22px;
  margin: 8px 0 4px;
  font-weight: bold;
  color: #0f172a;
}

.rhyme-box {
  background: #fef9c3;
  border: 1px dashed #eab308;
  color: #713f12;
  padding: 10px 14px;
  border-radius: 14px;
  margin: 10px auto;
  max-width: 520px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
}

.hint {
  color: #64748b;
  margin-top: 6px;
  font-size: 14px;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.action-btn {
  padding: 11px 15px;
  font-size: 14px;
}

.action-btn.rhyme-btn {
  background: #059669;
}

.action-btn:active, .tabs button:active {
  transform: scale(0.96);
}

h2 {
  margin: 18px 0 12px;
  font-size: 19px;
  color: #1d4ed8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.card {
  background: white;
  border: 1px solid #bfdbfe;
  border-radius: 14px;
  padding: 12px 6px;
  text-align: center;
  cursor: pointer;
  min-width: 0;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.12);
}

.card.selected {
  border: 3px solid #2563eb;
  background: #eff6ff;
}

.card .letter {
  display: block;
  font-size: 30px;
  font-weight: bold;
  color: #2563eb;
  line-height: 1.25;
}

.card .emoji {
  display: inline-block;
  font-size: 30px;
  margin: 5px 0;
  animation: floatSlow 3.5s ease-in-out infinite;
}

.card.selected .emoji {
  animation: animalMove 0.9s ease-in-out;
}

.card small {
  display: block;
  color: #475569;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.panel {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-top: 22px;
  border: 1px solid #dbeafe;
  box-shadow: 0 5px 15px rgba(219, 234, 254, 0.6);
}

#quizOptions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.quiz-option {
  background: #eff6ff;
  border: 2px solid #bfdbfe;
  padding: 14px;
  border-radius: 12px;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.quiz-option:disabled {
  cursor: default;
  opacity: 0.85;
}

#feedback {
  margin-top: 15px;
  font-weight: bold;
  font-size: 16px;
}

footer {
  text-align: center;
  margin: 25px 0 10px;
  color: #64748b;
  font-size: 13px;
}

[hidden] { display: none !important; }

@media(max-width:400px) {
  header h1 { font-size: 22px; }
  .big-char { font-size: 58px; }
  .picture { font-size: 66px; }
}
</style>
</head>

<section>

</section>

<footer>

}));

const languages = {
  bn: { items: bn, title: "বাংলা বর্ণমালা", voice: "bn-BD", dir: "ltr", pitch: 1.05, rate: 0.85 },
  en: { items: en, title: "English Alphabet", voice: "en-US", dir: "ltr", pitch: 1.06, rate: 0.86 },
  ar: { items: ar, title: "الحروف العربية", voice: "ar-SA", dir: "rtl", pitch: 1.04, rate: 0.82 }
};

let language = "bn";
let currentIndex = 0;
let quizData = [];
let quizIndex = 0;
let points = 0;
let answered = false;
let currentAudio = null;

const $ = id => document.getElementById(id);

function currentItems() {
  return languages[language].items;
}

function pickTeacherVoice(langCode) {
  if (!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  const prefix = langCode.split("-")[0].toLowerCase();
  const exact = voices.find(v => v.lang && v.lang.toLowerCase() === langCode.toLowerCase());
  if (exact) return exact;
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix)) || null;
}

function speakWithTTS(text, langConfig) {
  if (!("speechSynthesis" in window)) {
    alert("আপনার ব্রাউজারে ভয়েস সুবিধা নেই।");
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickTeacherVoice(langConfig.voice);
  if (voice) utter.voice = voice;
  utter.lang = langConfig.voice;
  utter.pitch = langConfig.pitch || 1.05;
  utter.rate = langConfig.rate || 0.85;
  speechSynthesis.speak(utter);
}

function speak(text, audioSrc) {
  const langConfig = languages[language];
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  if (audioSrc) {
    const audio = new Audio(audioSrc);
    currentAudio = audio;
    audio.play().catch(() => {
      speakWithTTS(text, langConfig);
    });
    return;
  }

  speakWithTTS(text, langConfig);
}

function triggerMoveAnimation() {
  const pic = $("picture");
  pic.classList.remove("moving");
  void pic.offsetWidth;
  pic.classList.add("moving");
}

function showLetter(index) {
  const items = currentItems();
  currentIndex = (index + items.length) % items.length;
  const item = items[currentIndex];
  const cfg = languages[language];

  $("bigChar").textContent = item.char;
  $("word").textContent = item.word;
  $("picture").textContent = item.emoji;
  $("rhymeText").textContent = item.rhyme;
  $("rhymeText").dir = cfg.dir;
  $("word").dir = cfg.dir;
  $("hint").textContent = "বর্ণ " + (currentIndex + 1) + " / " + items.length;

  triggerMoveAnimation();

  document.querySelectorAll(".card").forEach((card, i) => {
    card.classList.toggle("selected", i === currentIndex);
  });

  $("speakBtn").onclick = () => {
    triggerMoveAnimation();
    speak(item.speak, item.audioSrc);
  };

  $("rhymeBtn").onclick = () => {
    triggerMoveAnimation();
    speakWithTTS(item.rhymeSpeak, cfg);
  };

  $("picture").onclick = () => {
    triggerMoveAnimation();
    speak(item.speak, item.audioSrc);
  };
}

function renderGrid() {
  const items = currentItems();
  const cfg = languages[language];
  const grid = $("letterGrid");
  grid.innerHTML = "";
  grid.dir = cfg.dir;

  items.forEach((item, index) => {
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = item.char;

    const emoji = document.createElement("span");
    emoji.className = "emoji";
    emoji.textContent = item.emoji;
    emoji.style.animationDelay = ((index % 6) * 0.25) + "s";

    const small = document.createElement("small");
    small.textContent = item.word;

    card.append(letter, emoji, small);
    card.addEventListener("click", () => {
      showLetter(index);
      speak(item.speak, item.audioSrc);
    });

    grid.appendChild(card);
  });

  showLetter(currentIndex);
}

document.querySelectorAll("[data-language]").forEach(button => {
  button.addEventListener("click", () => {
    language = button.dataset.language;
    currentIndex = 0;

    document.querySelectorAll("[data-language]").forEach(b =>
      b.classList.toggle("active", b === button)
    );

    $("gridTitle").textContent = languages[language].title;
    renderGrid();
  });
});

$("prevBtn").onclick = () => showLetter(currentIndex - 1);
$("nextBtn").onclick = () => showLetter(currentIndex + 1);

function shuffle(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  const items = currentItems();
  quizData = shuffle(items).slice(0, 10);
  quizIndex = 0;
  points = 0;
  showQuiz();
}

function showQuiz() {
  answered = false;
  const item = quizData[quizIndex];
  const items = currentItems();
  const cfg = languages[language];

  $("quizQuestion").textContent = "কোনটি " + item.word + " এর সঠিক বর্ণ?";
  $("quizOptions").dir = cfg.dir;

  const wrong = shuffle(items.filter(x => x.char !== item.char)).slice(0, 3);
  const options = shuffle([item, ...wrong]);

  $("quizOptions").innerHTML = "";
  $("feedback").textContent = "";
  $("nextQuiz").hidden = true;

  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "quiz-option";
    button.textContent = option.char;

    button.onclick = () => {
      if (answered) return;
      answered = true;

      if (option.char === item.char) {
        points++;
        $("feedback").textContent = "🎉 চমৎকার! সঠিক উত্তর!";
        $("feedback").style.color = "green";
        speakWithTTS("সঠিক উত্তর!", languages.bn);
      } else {
        $("feedback").textContent = "❌ সঠিক উত্তর: " + item.char;
        $("feedback").style.color = "red";
      }

      [...$("quizOptions").children].forEach(btn => {
        btn.disabled = true;
      });

      $("score").textContent = "স্কোর: " + points + " / " + (quizIndex + 1);
      $("nextQuiz").hidden = false;
    };

    $("quizOptions").appendChild(button);
  });
}

$("startQuiz").onclick = startQuiz;

$("nextQuiz").onclick = () => {
  quizIndex++;
  if (quizIndex >= quizData.length) {
    $("quizQuestion").textContent =
      "🏆 কুইজ শেষ! আপনার ফলাফল: " + points + " / " + quizData.length;
    $("quizOptions").innerHTML = "";
    $("feedback").textContent =
      points >= 8 ? "অসাধারণ! খুব ভালো করেছেন।" : "আরও অনুশীলন করুন।";
    $("nextQuiz").hidden = true;
    return;
  }
  showQuiz();
};

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => {};
}

renderGrid();
</script>
