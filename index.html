<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3157d5">
<meta name="description" content="শিশুদের বাংলা, ইংরেজি, আরবি, প্রকৃতি, ছড়া ও ইসলামিক শিক্ষার স্মার্ট বই">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Noto Sans Bengali", Arial, sans-serif;
}
body {
  background: linear-gradient(180deg,#eef6ff,#f8fafc);
  color: #172554;
  padding: 15px;
}
header {
  text-align: center;
  padding: 18px 12px;
  background: linear-gradient(135deg,#2563eb,#7c3aed);
  color: white;
  border-radius: 20px;
  margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(37,99,235,.2);
}
.brand-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.brand-logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  object-fit: cover;
  background: #ffffff;
  border: 2px solid rgba(255,255,255,.7);
}
header h1 {font-size:25px}
header p {margin-top:7px;font-size:14px}

.tabs {
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.tabs button,.action-btn {
  border:none;
  padding:11px 12px;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.tabs button {flex:1 1 calc(33.33% - 8px);min-width:95px;font-size:13px}
.tabs button.active {background:#7c3aed}

.sub-tabs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:6px;
  margin-bottom:14px;
}
.sub-tabs button {
  flex:0 0 auto;
  border:1px solid #bfdbfe;
  background:#ffffff;
  color:#1e3a8a;
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}
.sub-tabs button.active {
  background:#059669;
  color:#ffffff;
  border-color:#059669;
}

.display-box {
  background:white;
  border:2px solid #93c5fd;
  border-radius:22px;
  text-align:center;
  padding:20px 15px;
  margin-bottom:18px;
  box-shadow:0 8px 20px rgba(219,234,254,.9);
  overflow:hidden;
}
@keyframes floatSlow {
  0%,100% {transform:translateY(0) rotate(0)}
  50% {transform:translateY(-10px) rotate(3deg)}
}
@keyframes animalMove {
  0% {transform:translateY(0) scale(1)}
  25% {transform:translateY(-14px) scale(1.12) rotate(-8deg)}
  50% {transform:translateY(-4px) scale(1.16) rotate(8deg)}
  75% {transform:translateY(-12px) scale(1.08)}
  100% {transform:translateY(0) scale(1)}
}
.picture {
  font-size:76px;
  margin:6px auto 10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:92px;
  min-height:92px;
  border-radius:22px;
  animation:floatSlow 3s ease-in-out infinite;
  cursor:pointer;
}
.picture.moving {animation:animalMove .9s ease-in-out}
.big-char {
  font-size:48px;
  font-weight:bold;
  color:#2563eb;
  line-height:1.3;
  overflow-wrap:anywhere;
}
.word {
  font-size:21px;
  margin:8px 0 4px;
  font-weight:bold;
  color:#0f172a;
}
.rhyme-box {
  background:#fef9c3;
  border:1px dashed #eab308;
  color:#713f12;
  padding:11px 14px;
  border-radius:14px;
  margin:10px auto;
  max-width:600px;
  font-size:15px;
  font-weight:600;
  line-height:1.6;
  white-space:pre-line;
}
.hint {color:#64748b;margin-top:6px;font-size:14px}
.actions {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.action-btn {padding:10px 14px;font-size:13px}
.action-btn.rhyme-btn {background:#059669}
.action-btn:active,.tabs button:active,.sub-tabs button:active {transform:scale(.96)}

h2 {margin:18px 0 12px;font-size:19px;color:#1d4ed8}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.card {
  background:white;
  border:1px solid #bfdbfe;
  border-radius:14px;
  padding:11px 6px;
  text-align:center;
  cursor:pointer;
  min-width:0;
}
.card.selected {border:3px solid #2563eb;background:#eff6ff}
.card .letter {
  display:block;
  font-size:20px;
  font-weight:bold;
  color:#2563eb;
  line-height:1.25;
  overflow-wrap:anywhere;
}
.card .emoji {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:10px;
  font-size:28px;
  margin:5px auto;
  animation:floatSlow 3.5s ease-in-out infinite;
}
.card small {
  display:block;
  color:#475569;
  font-size:12px;
  overflow-wrap:anywhere;
}

.panel {
  background:white;
  padding:18px;
  border-radius:18px;
  margin-top:22px;
  border:1px solid #dbeafe;
  box-shadow:0 5px 15px rgba(219,234,254,.6);
}
#quizOptions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.quiz-option {
  background:#eff6ff;
  border:2px solid #bfdbfe;
  padding:13px 8px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  overflow-wrap:anywhere;
}
.quiz-option:disabled {cursor:default;opacity:.85}
#feedback {margin-top:15px;font-weight:bold;font-size:16px}
footer {
  text-align:center;
  margin:25px 0 10px;
  color:#64748b;
  font-size:13px;
}
.install-btn {
  display:none;
  width:100%;
  margin-bottom:14px;
  padding:13px;
  border:0;
  border-radius:12px;
  color:white;
  background:#059669;
  font-weight:bold;
  font-size:15px;
}
[hidden] {display:none!important}
@media(max-width:420px) {
  header h1 {font-size:21px}
  .big-char {font-size:38px}
  .picture {font-size:62px}
}
</style>
</head>

<body>

<header>
  <div class="brand-row">

</header>

  <button data-topic="surahs">🕌 ২৫টি ছোট সূরা</button>
</div>

<section class="display-box">

  <div class="big-char" id="bigChar">অ</div>

    <button class="action-btn" id="prevBtn">⬅ আগের</button>
    <button class="action-btn" id="nextBtn">পরের ➡</button>
  </div>
</section>

<section>
  <h2 id="gridTitle">বাংলা বর্ণমালা</h2>
  <div class="grid" id="letterGrid"></div>
</section>

<section class="panel">
  <h2>🧠 শেখার কুইজ</h2>
  <p id="quizQuestion">প্রস্তুত হলে কুইজ শুরু করুন।</p>
  <div id="quizOptions"></div>
  <div id="feedback"></div>
  <div class="actions">
    <button class="action-btn" id="startQuiz">কুইজ শুরু</button>
    <button class="action-btn" id="nextQuiz" hidden>পরের প্রশ্ন</button>
  </div>
  <p id="score" style="margin-top:12px;font-weight:bold">স্কোর: ০</p>
</section>

<footer>
  Intelligence Book © 2026 | Smart Learning
  <p id="offlineStatus">অনলাইন শিক্ষার সুবিধা</p>
</footer>

function buildList(arr, defaultLang){
  return arr.map(x => ({
    char: x[0],
    word: x[1],
    emoji: x[2],
    rhyme: x[3],
    speak: x[4] || x[1],
    rhymeSpeak: x[3],
    lang: defaultLang
  }));
}

const voiceSettings = {
  bn: { lang:"bn-BD", dir:"ltr", pitch:1.12, rate:0.88 },
  en: { lang:"en-US", dir:"ltr", pitch:1.10, rate:0.88 },
  ar: { lang:"ar-SA", dir:"rtl", pitch:1.05, rate:0.84 }
};

let currentLang = "bn";
let currentTopic = "alphabet";
let currentIndex = 0;
let quizData = [];
let quizIndex = 0;
let points = 0;
let answered = false;

const $ = id => document.getElementById(id);

function getActiveItems(){
  return topicConfig[currentTopic].items[currentLang];
}

function pickClearVoice(langCode){
  if(!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const prefix = langCode.split("-")[0].toLowerCase();
  const matching = voices.filter(v => v.lang.toLowerCase().startsWith(prefix));
  const femaleMatch = matching.find(v =>
    /female|woman|girl|zira|samantha|ava|aria|google|bn|ar/i.test(v.name)
  );
  return femaleMatch || matching[0] || null;
}

function speakText(text, forceLang){
  if(!("speechSynthesis" in window)){
    alert("আপনার ডিভাইসে ভয়েস সুবিধা সক্রিয় নেই।");
    return;
  }
  const targetLang = forceLang || currentLang;
  const cfg = voiceSettings[targetLang] || voiceSettings.bn;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = cfg.lang;
  utter.pitch = cfg.pitch;
  utter.rate = cfg.rate;
  const voice = pickClearVoice(cfg.lang);
  if(voice) utter.voice = voice;
  speechSynthesis.speak(utter);
}

function triggerMoveAnimation(){
  const pic = $("picture");
  pic.classList.remove("moving");
  void pic.offsetWidth;
  pic.classList.add("moving");
}

function showItem(index){
  const items = getActiveItems();
  currentIndex = (index + items.length) % items.length;
  const item = items[currentIndex];
  const cfg = voiceSettings[currentLang];

  $("bigChar").textContent = item.char;
  $("word").textContent = item.word;
  $("picture").textContent = item.emoji;
  $("rhymeText").textContent = item.rhyme;
  $("rhymeText").dir = currentTopic === "surahs" ? "rtl" : cfg.dir;
  $("word").dir = cfg.dir;
  $("hint").textContent = "আইটেম " + (currentIndex + 1) + " / " + items.length;

  triggerMoveAnimation();

  document.querySelectorAll(".card").forEach((card,i)=>{
    card.classList.toggle("selected", i === currentIndex);
  });

  $("speakBtn").onclick = () => {
    triggerMoveAnimation();
    speakText(item.speak, item.lang);
  };
  $("rhymeBtn").onclick = () => {
    triggerMoveAnimation();
    speakText(item.rhymeSpeak, item.lang);
  };
  $("picture").onclick = () => {
    triggerMoveAnimation();
    speakText(item.speak, item.lang);
  };
}

function renderGrid(){
  const items = getActiveItems();
  const cfg = voiceSettings[currentLang];
  const grid = $("letterGrid");
  grid.innerHTML = "";
  grid.dir = cfg.dir;
  $("gridTitle").textContent = topicConfig[currentTopic].title[currentLang];

  items.forEach((item,index)=>{
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = item.char;

    const emoji = document.createElement("span");
    emoji.className = "emoji";
    emoji.textContent = item.emoji;

    const small = document.createElement("small");
    small.textContent = item.word;

    card.append(letter, emoji, small);
    card.addEventListener("click", ()=>{
      showItem(index);
      speakText(item.speak, item.lang);
    });
    grid.appendChild(card);
  });
  showItem(currentIndex);
}

document.querySelectorAll("[data-lang]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentLang = btn.dataset.lang;
    currentIndex = 0;
    document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active", b === btn));
    renderGrid();
  });
});

document.querySelectorAll("[data-topic]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTopic = btn.dataset.topic;
    currentIndex = 0;
    document.querySelectorAll("[data-topic]").forEach(b=>b.classList.toggle("active", b === btn));
    renderGrid();
    $("quizQuestion").textContent = "এই সেকশনের কুইজ শুরু করতে 'কুইজ শুরু' চাপুন।";
    $("quizOptions").innerHTML = "";
    $("feedback").textContent = "";
    $("nextQuiz").hidden = true;
  });
});

$("prevBtn").onclick = () => showItem(currentIndex - 1);
$("nextBtn").onclick = () => showItem(currentIndex + 1);

function shuffle(items){
  const copy = [...items];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startQuiz(){
  const items = getActiveItems();
  quizData = shuffle(items).slice(0, Math.min(10, items.length));
  quizIndex = 0;
  points = 0;
  $("score").textContent = "স্কোর: ০";
  showQuiz();
}

function showQuiz(){
  answered = false;
  const item = quizData[quizIndex];
  const items = getActiveItems();

  $("quizQuestion").textContent = "কোনটি '" + item.word + "' এর সঠিক পরিচিতি?";

  const wrong = shuffle(items.filter(x => x.char !== item.char)).slice(0, 3);
  const options = shuffle([item, ...wrong]);

  $("quizOptions").innerHTML = "";
  $("feedback").textContent = "";
  $("nextQuiz").hidden = true;

  options.forEach(option=>{
    const button = document.createElement("button");
    button.className = "quiz-option";
    button.type = "button";
    button.textContent = option.char;
    button.onclick = ()=>{
      if(answered) return;
      answered = true;
      if(option.char === item.char){
        points++;
        $("feedback").textContent = "🎉 চমৎকার! সঠিক উত্তর!";
        $("feedback").style.color = "green";
        speakText("সঠিক উত্তর!", "bn");
      }else{
        $("feedback").textContent = "❌ সঠিক উত্তর: " + item.char;
        $("feedback").style.color = "red";
      }
      [...$("quizOptions").children].forEach(btn => btn.disabled = true);
      $("score").textContent = "স্কোর: " + points + " / " + (quizIndex + 1);
      $("nextQuiz").hidden = false;
    };
    $("quizOptions").appendChild(button);
  });
}

$("startQuiz").onclick = startQuiz;
$("nextQuiz").onclick = ()=>{
  quizIndex++;
  if(quizIndex >= quizData.length){
    $("quizQuestion").textContent = "🏆 কুইজ শেষ! আপনার ফলাফল: " + points + " / " + quizData.length;
    $("quizOptions").innerHTML = "";
    $("feedback").textContent = points >= Math.ceil(quizData.length * 0.7) ? "অসাধারণ! খুব ভালো করেছেন।" : "আরও অনুশীলন করুন।";
    $("nextQuiz").hidden = true;
    return;
  }
  showQuiz();
};

let deferredPrompt;
const installBtn = $("installBtn");

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredPrompt = event;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click",async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});

window.addEventListener("appinstalled",()=>{
  installBtn.style.display = "none";
});
</script>
