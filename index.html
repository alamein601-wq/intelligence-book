<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Noto Sans Bengali", Arial, sans-serif;
}
body {
  background: linear-gradient(180deg,#eef6ff,#f8fafc);
  color: #172554;
  padding: 15px;
}
header {
  text-align: center;
  padding: 20px 12px;
  background: linear-gradient(135deg,#2563eb,#7c3aed);
  color: white;
  border-radius: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(37,99,235,.2);
}
header h1 {font-size:26px}
header p {margin-top:8px;font-size:15px}
.tabs {
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.tabs button,.action-btn {
  border:none;
  padding:12px;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.tabs button {flex:1;font-size:14px}
.tabs button.active {background:#7c3aed}
.display-box {
  background:white;
  border:2px solid #93c5fd;
  border-radius:22px;
  text-align:center;
  padding:22px 16px;
  margin-bottom:18px;
  box-shadow:0 8px 20px rgba(219,234,254,.9);
  overflow:hidden;
}
@keyframes floatSlow {
  0%,100% {transform:translateY(0) rotate(0)}
  50% {transform:translateY(-10px) rotate(3deg)}
}
@keyframes animalMove {
  0% {transform:translateY(0) scale(1)}
  25% {transform:translateY(-14px) scale(1.12) rotate(-8deg)}
  50% {transform:translateY(-4px) scale(1.16) rotate(8deg)}
  75% {transform:translateY(-12px) scale(1.08)}
  100% {transform:translateY(0) scale(1)}
}
.picture {
  font-size:80px;
  margin:8px auto 12px;
  display:inline-block;
  animation:floatSlow 3s ease-in-out infinite;
  cursor:pointer;
}
.picture.moving {animation:animalMove .9s ease-in-out}
.big-char {
  font-size:74px;
  font-weight:bold;
  color:#2563eb;
  line-height:1.25;
}
.word {
  font-size:22px;
  margin:8px 0 4px;
  font-weight:bold;
  color:#0f172a;
}
.rhyme-box {
  background:#fef9c3;
  border:1px dashed #eab308;
  color:#713f12;
  padding:10px 14px;
  border-radius:14px;
  margin:10px auto;
  max-width:520px;
  font-size:16px;
  font-weight:600;
  line-height:1.5;
}
.hint {color:#64748b;margin-top:6px;font-size:14px}
.actions {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.action-btn {padding:11px 15px;font-size:14px}
.action-btn.rhyme-btn {background:#059669}
.action-btn:active,.tabs button:active {transform:scale(.96)}
h2 {margin:18px 0 12px;font-size:19px;color:#1d4ed8}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.card {
  background:white;
  border:1px solid #bfdbfe;
  border-radius:14px;
  padding:12px 6px;
  text-align:center;
  cursor:pointer;
  min-width:0;
}
.card.selected {border:3px solid #2563eb;background:#eff6ff}
.card .letter {
  display:block;
  font-size:30px;
  font-weight:bold;
  color:#2563eb;
  line-height:1.25;
}
.card .emoji {
  display:inline-block;
  font-size:30px;
  margin:5px 0;
  animation:floatSlow 3.5s ease-in-out infinite;
}
.card small {
  display:block;
  color:#475569;
  font-size:12px;
  overflow-wrap:anywhere;
}
.panel {
  background:white;
  padding:18px;
  border-radius:18px;
  margin-top:22px;
  border:1px solid #dbeafe;
  box-shadow:0 5px 15px rgba(219,234,254,.6);
}
#quizOptions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.quiz-option {
  background:#eff6ff;
  border:2px solid #bfdbfe;
  padding:14px;
  border-radius:12px;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
}
.quiz-option:disabled {cursor:default;opacity:.85}
#feedback {margin-top:15px;font-weight:bold;font-size:16px}
footer {
  text-align:center;
  margin:25px 0 10px;
  color:#64748b;
  font-size:13px;
}
.install-btn {
  display:none;
  width:100%;
  margin-bottom:15px;
  padding:13px;
  border:0;
  border-radius:12px;
  color:white;
  background:#059669;
  font-weight:bold;
  font-size:15px;
}
[hidden] {display:none!important}
@media(max-width:400px) {
  header h1 {font-size:22px}
  .big-char {font-size:58px}
  .picture {font-size:66px}
}
</style>

<footer>

const makeItems = (data, language) => data.map(x => ({
  char:x[0],
  word:x[1],
  emoji:x[2],
  rhyme:x[3],
  speak:x[4] || x[1],
  rhymeSpeak:x[3],
  lang:language
}));

const languages = {
  bn:{items:makeItems(bn,"bn"),title:"বাংলা বর্ণমালা",voice:"bn-BD",dir:"ltr",pitch:1.05,rate:.85},
  en:{items:makeItems(en,"en"),title:"English Alphabet",voice:"en-US",dir:"ltr",pitch:1.06,rate:.86},
  ar:{items:makeItems(ar,"ar"),title:"الحروف العربية",voice:"ar-SA",dir:"rtl",pitch:1.04,rate:.82}
};

let language="bn";
let currentIndex=0;
let quizData=[];
let quizIndex=0;
let points=0;
let answered=false;
let currentAudio=null;

const $=id=>document.getElementById(id);
function currentItems(){return languages[language].items}

function speakWithTTS(text,config){
  if(!("speechSynthesis" in window)){
    alert("আপনার ব্রাউজারে ভয়েস সুবিধা নেই।");
    return;
  }
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang=config.voice;
  utter.pitch=config.pitch;
  utter.rate=config.rate;
  const prefix=config.voice.split("-")[0];
  const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(prefix.toLowerCase()));
  if(voice) utter.voice=voice;
  speechSynthesis.speak(utter);
}

function speak(text){
  if(currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }
  speakWithTTS(text,languages[language]);
}

function triggerMoveAnimation(){
  const pic=$("picture");
  pic.classList.remove("moving");
  void pic.offsetWidth;
  pic.classList.add("moving");
}

function showLetter(index){
  const items=currentItems();
  currentIndex=(index+items.length)%items.length;
  const item=items[currentIndex];
  const cfg=languages[language];

  $("bigChar").textContent=item.char;
  $("word").textContent=item.word;
  $("picture").textContent=item.emoji;
  $("rhymeText").textContent=item.rhyme;
  $("rhymeText").dir=cfg.dir;
  $("word").dir=cfg.dir;
  $("hint").textContent="বর্ণ "+(currentIndex+1)+" / "+items.length;

  triggerMoveAnimation();

  document.querySelectorAll(".card").forEach((card,i)=>{
    card.classList.toggle("selected",i===currentIndex);
  });

  $("speakBtn").onclick=()=>{triggerMoveAnimation();speak(item.speak)};
  $("rhymeBtn").onclick=()=>{triggerMoveAnimation();speak(item.rhymeSpeak)};
  $("picture").onclick=()=>{triggerMoveAnimation();speak(item.speak)};
}

function renderGrid(){
  const items=currentItems();
  const cfg=languages[language];
  const grid=$("letterGrid");
  grid.innerHTML="";
  grid.dir=cfg.dir;

  items.forEach((item,index)=>{
    const card=document.createElement("button");
    card.className="card";
    card.type="button";

    const letter=document.createElement("span");
    letter.className="letter";
    letter.textContent=item.char;

    const emoji=document.createElement("span");
    emoji.className="emoji";
    emoji.textContent=item.emoji;

    const small=document.createElement("small");
    small.textContent=item.word;

    card.append(letter,emoji,small);
    card.addEventListener("click",()=>{
      showLetter(index);
      speak(item.speak);
    });
    grid.appendChild(card);
  });
  showLetter(currentIndex);
}

document.querySelectorAll("[data-language]").forEach(button=>{
  button.addEventListener("click",()=>{
    language=button.dataset.language;
    currentIndex=0;
    document.querySelectorAll("[data-language]").forEach(b=>
      b.classList.toggle("active",b===button)
    );
    $("gridTitle").textContent=languages[language].title;
    renderGrid();
    $("quizQuestion").textContent="প্রস্তুত হলে কুইজ শুরু করুন।";
    $("quizOptions").innerHTML="";
    $("feedback").textContent="";
    $("nextQuiz").hidden=true;
  });
});

$("prevBtn").onclick=()=>showLetter(currentIndex-1);
$("nextBtn").onclick=()=>showLetter(currentIndex+1);

function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function startQuiz(){
  quizData=shuffle(currentItems()).slice(0,10);
  quizIndex=0;
  points=0;
  showQuiz();
}

function showQuiz(){
  answered=false;
  const item=quizData[quizIndex];
  const items=currentItems();
  const cfg=languages[language];

  $("quizQuestion").textContent="কোনটি "+item.word+" এর সঠিক বর্ণ?";
  $("quizOptions").dir=cfg.dir;

  const wrong=shuffle(items.filter(x=>x.char!==item.char)).slice(0,3);
  const options=shuffle([item,...wrong]);

  $("quizOptions").innerHTML="";
  $("feedback").textContent="";
  $("nextQuiz").hidden=true;

  options.forEach(option=>{
    const button=document.createElement("button");
    button.className="quiz-option";
    button.textContent=option.char;
    button.onclick=()=>{
      if(answered)return;
      answered=true;
      if(option.char===item.char){
        points++;
        $("feedback").textContent="🎉 চমৎকার! সঠিক উত্তর!";
        $("feedback").style.color="green";
        speakWithTTS("সঠিক উত্তর!",languages.bn);
      }else{
        $("feedback").textContent="❌ সঠিক উত্তর: "+item.char;
        $("feedback").style.color="red";
      }
      [...$("quizOptions").children].forEach(btn=>btn.disabled=true);
      $("score").textContent="স্কোর: "+points+" / "+(quizIndex+1);
      $("nextQuiz").hidden=false;
    };
    $("quizOptions").appendChild(button);
  });
}

$("startQuiz").onclick=startQuiz;
$("nextQuiz").onclick=()=>{
  quizIndex++;
  if(quizIndex>=quizData.length){
    $("quizQuestion").textContent="🏆 কুইজ শেষ! আপনার ফলাফল: "+points+" / "+quizData.length;
    $("quizOptions").innerHTML="";
    $("feedback").textContent=points>=8?"অসাধারণ! খুব ভালো করেছেন।":"আরও অনুশীলন করুন।";
    $("nextQuiz").hidden=true;
    return;
  }
  showQuiz();
};

  speechSynthesis.onvoiceschanged=()=>{};
}

renderGrid();

// Install App
let deferredPrompt;
const installBtn=$("installBtn");

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredPrompt=event;
  installBtn.style.display="block";
});

installBtn.addEventListener("click",async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display="none";
});

window.addEventListener("appinstalled",()=>{
  installBtn.style.display="none";
});
</script>
